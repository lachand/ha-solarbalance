# Signature (fusion Signature x Établi), thème Home Assistant.
signature:
  primary-font-family: "'Inter Tight', 'Segoe UI', system-ui, sans-serif"
  ha-font-family-body: "'Inter Tight', 'Segoe UI', system-ui, sans-serif"
  ha-font-family-heading: "'Fraunces', 'Iowan Old Style', Georgia, serif"
  ha-font-family-code: "'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace"
  paper-font-common-base_-_font-family: "'Inter Tight', 'Segoe UI', system-ui, sans-serif"
  ha-card-border-radius: "2px"
  ha-card-border-width: "1px"
  ha-card-box-shadow: "0 1px 0 rgba(42,33,24,0.14)"
  ha-card-border-color: "#cbc3aa"
  modes:
    light:
      primary-color: "#a63d14"
      light-primary-color: "#f2d9c6"
      dark-primary-color: "#862f0c"
      accent-color: "#a63d14"
      text-primary-color: "#fff9ef"
      primary-text-color: "#2a2118"
      secondary-text-color: "#5a4d3e"
      disabled-text-color: "#5a4d3e"
      primary-background-color: "#eae6d7"
      secondary-background-color: "#dbd6c4"
      card-background-color: "#f6f2e7"
      divider-color: "#cbc3aa"
      state-icon-color: "#5a4d3e"
      state-icon-active-color: "#a63d14"
      error-color: "#a3162b"
      warning-color: "#8a5a00"
      success-color: "#14654f"
      info-color: "#0b63a5"
      energy-solar-color: "#0b63a5"
      energy-grid-consumption-color: "#a85f00"
      energy-battery-in-color: "#8e3a78"
      energy-battery-out-color: "#8e3a78"
    dark:
      primary-color: "#e8895a"
      light-primary-color: "#3d2a20"
      dark-primary-color: "#f2a27c"
      accent-color: "#e8895a"
      text-primary-color: "#1e1b18"
      primary-text-color: "#f3ebdc"
      secondary-text-color: "#bdb1a0"
      disabled-text-color: "#bdb1a0"
      primary-background-color: "#1e1b18"
      secondary-background-color: "#171512"
      card-background-color: "#27231f"
      divider-color: "#3e372f"
      state-icon-color: "#bdb1a0"
      state-icon-active-color: "#e8895a"
      error-color: "#ff8a80"
      warning-color: "#e8b93e"
      success-color: "#55c4a8"
      info-color: "#62b6f0"
      energy-solar-color: "#62b6f0"
      energy-grid-consumption-color: "#e8a33a"
      energy-battery-in-color: "#e091c2"
      energy-battery-out-color: "#e091c2"
      ha-card-box-shadow: "0 1px 0 rgba(0,0,0,0.5)"
      ha-card-border-color: "#3e372f"

