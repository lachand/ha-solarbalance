pause:
  name: Pause SolarBalance
  description: Suspends the HEMS — calculated setpoints are no longer published.

resume:
  name: Resume SolarBalance
  description: Resumes normal operation after a pause.

force_charge:
  name: Force charge
  description: Force batteries to charge towards a target SoC, optionally with a deadline.
  fields:
    target_soc_pct:
      name: Target SoC (%)
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    power_w:
      name: Power limit (W)
      required: false
      selector:
        number:
          min: 0
          max: 20000
          unit_of_measurement: "W"
    deadline:
      name: Deadline
      required: false
      selector:
        datetime:

force_discharge:
  name: Force discharge
  description: Force batteries to discharge towards a target SoC.
  fields:
    target_soc_pct:
      name: Target SoC (%)
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    power_w:
      name: Power limit (W)
      required: false
      selector:
        number:
          min: 0
          max: 20000
          unit_of_measurement: "W"

force_charge_load:
  name: Charge a load now
  description: >
    Force a load to charge at full power now (grid-backed, even without solar
    surplus), overriding shedding and fast-charge pause. Optionally limit by
    energy or duration; otherwise it runs until cancelled.
  fields:
    load:
      name: Load name
      description: The configured load name (e.g. "voiture").
      required: true
      selector:
        text:
    kwh:
      name: Target energy (kWh)
      description: Stop once this much energy has been delivered this session.
      required: false
      selector:
        number:
          min: 0
          max: 200
          step: 0.5
          unit_of_measurement: "kWh"
    hours:
      name: Maximum duration (h)
      description: Stop after this many hours.
      required: false
      selector:
        number:
          min: 0
          max: 24
          step: 0.5
          unit_of_measurement: "h"

cancel_force_charge_load:
  name: Cancel charge-now
  description: Cancel a manual "charge now" request for a load.
  fields:
    load:
      name: Load name
      required: true
      selector:
        text:

replay:
  name: Replay a past day
  description: >
    Re-run the decision engine over a past day from recorder history (read-only,
    no writes) and return an hourly summary of what it would have decided and the
    would-be grid cost.
  fields:
    date:
      name: Day (YYYY-MM-DD)
      description: Defaults to yesterday.
      required: false
      selector:
        text:
    step_minutes:
      name: Sample step (minutes)
      required: false
      selector:
        number:
          min: 5
          max: 60
          step: 5
          unit_of_measurement: min

test_mapping:
  name: Test entity mapping
  description: >
    Check every configured device/meter/load entity and report which are OK,
    unavailable, or missing (response data). Use it to validate a fresh setup.

set_mode:
  name: Set HEMS mode
  description: Set the global operating mode.
  fields:
    mode:
      name: Mode
      required: true
      selector:
        select:
          options:
            - normal
            - storm
            - vacation
            - paused

activate_storm_mode:
  name: Activate storm mode
  description: Manually trigger storm preparation.
  fields:
    duration_h:
      name: Duration (hours)
      required: false
      selector:
        number:
          min: 1
          max: 72
          unit_of_measurement: "h"

export_config:
  name: Export device configuration
  description: >
    Return all UI sub-entries (batteries, inverters, meters, loads) as response
    data — copy it to back up or migrate your configuration.

import_config:
  name: Import device configuration
  description: >
    Re-create UI sub-entries from a previously exported list. Adds them to the
    current entry (does not delete existing ones); the integration reloads.
  fields:
    subentries:
      name: Sub-entries
      description: The "subentries" list returned by export_config.
      required: true
      selector:
        object:
