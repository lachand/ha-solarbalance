pause:
  name: Pause SolarBalance
  description: Suspends the HEMS — calculated setpoints are no longer published.

resume:
  name: Resume SolarBalance
  description: Resumes normal operation after a pause.

force_charge:
  name: Force charge
  description: Force batteries to charge towards a target SoC, optionally with a deadline.
  fields:
    target_soc_pct:
      name: Target SoC (%)
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    power_w:
      name: Power limit (W)
      required: false
      selector:
        number:
          min: 0
          max: 20000
          unit_of_measurement: "W"
    deadline:
      name: Deadline
      required: false
      selector:
        datetime:

force_discharge:
  name: Force discharge
  description: Force batteries to discharge towards a target SoC.
  fields:
    target_soc_pct:
      name: Target SoC (%)
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    power_w:
      name: Power limit (W)
      required: false
      selector:
        number:
          min: 0
          max: 20000
          unit_of_measurement: "W"

force_charge_load:
  name: Charge a load now
  description: >
    Force a load to charge at full power now (grid-backed, even without solar
    surplus), overriding shedding and fast-charge pause. Optionally limit by
    energy or duration; otherwise it runs until cancelled.
  fields:
    load:
      name: Load name
      description: The configured load name (e.g. "voiture").
      required: true
      selector:
        text:
    kwh:
      name: Target energy (kWh)
      description: Stop once this much energy has been delivered this session.
      required: false
      selector:
        number:
          min: 0
          max: 200
          step: 0.5
          unit_of_measurement: "kWh"
    hours:
      name: Maximum duration (h)
      description: Stop after this many hours.
      required: false
      selector:
        number:
          min: 0
          max: 24
          step: 0.5
          unit_of_measurement: "h"

cancel_force_charge_load:
  name: Cancel charge-now
  description: Cancel a manual "charge now" request for a load.
  fields:
    load:
      name: Load name
      required: true
      selector:
        text:

replay:
  name: Replay a past day
  description: >
    Re-run the decision engine over a past day from recorder history (read-only,
    no writes) and return an hourly summary of what it would have decided and the
    would-be grid cost.
  fields:
    date:
      name: Day (YYYY-MM-DD)
      description: Defaults to yesterday.
      required: false
      selector:
        text:
    step_minutes:
      name: Sample step (minutes)
      required: false
      selector:
        number:
          min: 5
          max: 60
          step: 5
          unit_of_measurement: min

test_mapping:
  name: Test entity mapping
  description: >
    Check every configured device/meter/load entity and report which are OK,
    unavailable, or missing (response data). Use it to validate a fresh setup.

set_mode:
  name: Set HEMS mode
  description: Set the global operating mode.
  fields:
    mode:
      name: Mode
      required: true
      selector:
        select:
          options:
            - normal
            - storm
            - vacation
            - paused

activate_storm_mode:
  name: Activate storm mode
  description: Manually trigger storm preparation.
  fields:
    duration_h:
      name: Duration (hours)
      required: false
      selector:
        number:
          min: 1
          max: 72
          unit_of_measurement: "h"

reset_baseline_talon:
  name: Reset standby baseline (talon)
  description: >
    Discard the learned night standby baseline (talon) and re-estimate it at the next
    quiet night. Use after a one-off big night load (e.g. EV charging) inflated it and
    caused wrong end-of-day load shedding.

export_config:
  name: Export device configuration
  description: >
    Return all UI sub-entries (batteries, inverters, meters, loads) as response
    data — copy it to back up or migrate your configuration.

import_config:
  name: Import device configuration
  description: >
    Re-create UI sub-entries from a previously exported list. Adds them to the
    current entry (does not delete existing ones); the integration reloads.
  fields:
    subentries:
      name: Sub-entries
      description: The "subentries" list returned by export_config.
      required: true
      selector:
        object:

capture_debug:
  name: Capture debug tick history
  description: >
    Dump the last ~2 hours of per-tick regulation records (grid, fleet target,
    binding, per-battery setpoints, battery staleness, anticipation…) to a JSONL
    file under config/solarbalance_debug/, for offline replay of a glitch. Call it
    after you notice something — the data is already buffered.
  fields:
    minutes:
      name: Minutes
      description: Keep only the most recent N minutes (blank = the whole buffer).
      required: false
      example: 20
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
    include_records:
      name: Include the records in the response
      description: >
        Also return the ticks in the service response. The JSONL file lands on the
        Home Assistant host, which is unreadable to an automation or a remote
        analysis — the path alone is of no use to them.
      required: false
      example: true
      selector:
        boolean:

rename_appliance_program:
  name: Rename an appliance cycle program
  description: >
    Re-file an appliance's learned cycles under a different label. Useful for the
    cycles the appliance integration never managed to identify (they are filed as
    "unknown"). Merges into the destination when it already exists.
  fields:
    appliance:
      name: Appliance
      description: Appliance name as shown in the panel (e.g. "machine a laver").
      required: true
      example: machine a laver
      selector:
        text:
    from_program:
      name: From
      description: Current label to move away from.
      required: true
      example: unknown
      selector:
        text:
    to_program:
      name: To
      description: New label.
      required: true
      example: Coton 40
      selector:
        text:

label_last_cycle:
  name: Label the last appliance cycle
  description: >
    Give a name to the most recently finished cycle. On a smart-plug setup with no
    program signal, every cycle lands in "unknown" together — this peels off just
    the wash you just ran so a 40° and a 20° end up in separate buckets, one cycle
    at a time.
  fields:
    appliance:
      name: Appliance
      description: Appliance name as shown in the panel (e.g. "machine a laver").
      required: true
      example: machine a laver
      selector:
        text:
    program:
      name: Program
      description: The label to give the last finished cycle.
      required: true
      example: Coton 60
      selector:
        text:
    from_program:
      name: From
      description: >
        Which bucket the last cycle is taken from. Defaults to "unknown"; set it to
        fix a mislabel (move the last cycle of one named program to another).
      required: false
      example: unknown
      selector:
        text:
