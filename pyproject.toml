[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solarbalance"
version = "0.1.0"
description = "Home Energy Management System (HEMS) for Home Assistant"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
authors = [{ name = "SolarBalance Contributors" }]
keywords = ["home-assistant", "hems", "solar", "battery", "energy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-homeassistant-custom-component>=0.13",
    "home-assistant-frontend",  # required so the frontend dependency sets up in integration tests
    # Pinned to a minor: ruff 0.16 started formatting python blocks inside .md
    # and broke CI with no code change. Patches are fine, minors are not.
    "ruff>=0.16,<0.17",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/solarbalance/ha-solarbalance"
Issues = "https://github.com/solarbalance/ha-solarbalance/issues"
Documentation = "https://github.com/solarbalance/ha-solarbalance/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/solarbalance"]

# ----------------------------------------------------------------------
# Ruff — single source of truth for linting and formatting
# ----------------------------------------------------------------------
[tool.ruff]
# Home Assistant 2026.6 still ships Python 3.13, so target 3.13 to avoid emitting
# 3.14-only syntax (e.g. PEP 758 unparenthesised `except A, B:`) that breaks at
# runtime on the user's HA.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "TID",
    "RUF",
    "D",
]
ignore = [
    "D100",
    "D104",
    "D105",  # Magic methods in dataclasses (__post_init__) are self-documenting
    "D107",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"custom_components/solarbalance/__init__.py" = ["D"]
# HA entity protocol overrides (native_value, async_turn_on, etc.) and coordinator
# properties do not need individual docstrings; the class docstring covers them.
"custom_components/solarbalance/sensor.py" = ["D102"]
"custom_components/solarbalance/binary_sensor.py" = ["D102"]
"custom_components/solarbalance/switch.py" = ["D102"]
"custom_components/solarbalance/number.py" = ["D102"]
"custom_components/solarbalance/select.py" = ["D102"]
"custom_components/solarbalance/coordinator.py" = ["D102"]
# Intra-package relative imports are intentional across all core and adapter modules.
"custom_components/solarbalance/core/**" = ["TID252"]
"custom_components/solarbalance/adapters/**" = ["TID252"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ----------------------------------------------------------------------
# Mypy — strict on core, normal elsewhere
# ----------------------------------------------------------------------
[tool.mypy]
# Kept at 3.14 so mypy can parse the installed Home Assistant (whose own code
# already uses PEP 758 syntax). This only affects type analysis — our runtime
# target is 3.13 (ruff target-version = py313 keeps our syntax 3.13-safe).
python_version = "3.14"
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "custom_components.solarbalance.core.*"
strict = true

# ----------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "core: tests that exercise the core engine without HA",
    "integration: tests that require Home Assistant fixtures",
]

[tool.coverage.run]
source = ["custom_components/solarbalance"]
omit = [
    "tests/*",
    "custom_components/solarbalance/translations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
