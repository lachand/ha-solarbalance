name: Build solarbalance-card

on:
  push:
    branches: [main]
    paths:
      - "frontend/solarbalance-card/**"
  pull_request:
    paths:
      - "frontend/solarbalance-card/**"
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/solarbalance-card/package-lock.json

      - name: Install dependencies
        working-directory: frontend/solarbalance-card
        run: npm ci

      - name: Build
        working-directory: frontend/solarbalance-card
        run: npm run build

      - name: Commit built bundle (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/solarbalance/www/solarbalance-card.js
          git diff --cached --quiet || git commit -m "chore(frontend): rebuild solarbalance-card bundle [skip ci]"
          git push

      - name: Upload bundle as release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/solarbalance/www/solarbalance-card.js
