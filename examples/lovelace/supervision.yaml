# SolarBalance — vue de supervision & réglage de la régulation.
#
# Cartes natives uniquement (aucun HACS). Ajoute-la comme nouvelle vue. Les
# entités diagnostic/advisory sont de catégorie « diagnostic » ; si un entity_id
# ne correspond pas, vérifie-le dans Outils de développement → États (filtre :
# solarbalance). Les noms sont slugifiés, ex. « Grid power (filtered) » →
# sensor.solarbalance_grid_power_filtered.

title: SolarBalance — Supervision
icon: mdi:tune-variant
path: solarbalance-supervision

cards:
  # ----- Boucle de régulation (un changement de signe = oscillation) --------
  - type: history-graph
    title: Boucle de régulation (1 h)
    hours_to_show: 1
    refresh_interval: 10
    entities:
      - entity: sensor.solarbalance_grid_power
        name: Réseau (brut)
      - entity: sensor.solarbalance_grid_power_filtered
        name: Réseau (filtré → régulateur)
      - entity: sensor.solarbalance_regulation_target
        name: Cible parc
      - entity: sensor.solarbalance_battery_power
        name: Batterie (mesurée)

  # ----- Internes de régulation (réglage) -----------------------------------
  - type: entities
    title: Internes de régulation
    state_color: false
    entities:
      - entity: sensor.solarbalance_zero_injection_correction
        name: Correction zéro-injection
        secondary_info: last-changed
      - entity: sensor.solarbalance_soc_equaliser_offer
        name: Offre équaliseur SoC
      - entity: sensor.solarbalance_pv_output_limit
        name: Limite de sortie PV (écrêtage)
      - entity: sensor.solarbalance_baseline_consumption
        name: Consommation de fond
      - entity: sensor.solarbalance_battery_soc_avg
        name: SoC moyen du parc

  # ----- Plan prédictif (observation seule) ---------------------------------
  - type: entities
    title: Plan prédictif (advisory)
    entities:
      - entity: sensor.solarbalance_planner_recommended_power_advisory
        name: Puissance batterie recommandée
      - entity: sensor.solarbalance_planner_expected_cost_advisory
        name: Coût attendu (24 h)

  # ----- Antisèche de réglage -----------------------------------------------
  - type: markdown
    title: Antisèche de réglage
    content: >
      **Yoyo sur le réseau ?** Regarde *Correction zéro-injection* : si elle
      change de signe à chaque tick, baisse `zero_injection_kp` (0.3–0.4) et/ou
      monte `grid_filter_samples` (5).


      **Réseau décalé de 0 W ?** Vérifie *Offre équaliseur SoC* (l'équaliseur
      décale la cible volontairement) et `zero_injection_setpoint_w` ; resserre
      avec un `zero_injection_hysteresis_w` plus petit.


      **Écrêtage trop/pas assez ?** Compare *Limite de sortie PV* à la puissance
      PV quand les batteries sont pleines.
