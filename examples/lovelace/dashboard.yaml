# Complete Lovelace view for SolarBalance.
# Requires HACS cards: power-flow-card-plus, apexcharts-card, mushroom.
#
# Optional: add sensor.solcast_pv_forecast_forecast_today to the PV chart if
# you have the Solcast integration installed.
# Optional: uncomment tariff chart if you have configured tariff_config.

title: SolarBalance
icon: mdi:solar-power-variant
path: solarbalance

cards:
  # ----- Top row: status + flow ----------------------------------------------
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: "{{ states('sensor.solarbalance_mode') | title }}"
        secondary: "Priority: {{ states('sensor.solarbalance_dominant_strategy') }}"
        icon: mdi:home-battery
        icon_color: |-
          {% set m = states('sensor.solarbalance_mode') %}
          {% if m == 'storm' %}red
          {% elif m == 'degraded' %}orange
          {% elif m == 'paused' %}grey
          {% elif m == 'manual_override' %}yellow
          {% else %}green{% endif %}

      - type: custom:mushroom-entity-card
        entity: binary_sensor.solarbalance_storm_mode
        icon: mdi:weather-lightning
        name: Storm mode

      - type: custom:mushroom-entity-card
        entity: binary_sensor.solarbalance_degraded
        icon: mdi:alert-circle
        name: Degraded

  - type: custom:power-flow-card-plus
    title: Energy flow
    entities:
      grid:
        entity: sensor.solarbalance_grid_power
      solar:
        entity: sensor.solarbalance_pv_power
      battery:
        entity: sensor.solarbalance_battery_power
      home:
        entity: sensor.solarbalance_baseline_consumption
        override_state: true

  # ----- PV production (last 24 h) ------------------------------------------
  - type: custom:apexcharts-card
    header:
      show: true
      title: PV — production (24 h)
    graph_span: 24h
    span:
      start: hour
    series:
      - entity: sensor.solarbalance_pv_power
        name: PV power
        type: area
      # Uncomment to add Solcast forecast:
      # - entity: sensor.solcast_pv_forecast_forecast_today
      #   name: Forecast (Solcast)
      #   type: line

  # ----- Decisions log -------------------------------------------------------
  - type: entities
    title: Latest arbitration
    entities:
      - entity: sensor.solarbalance_mode
      - entity: sensor.solarbalance_dominant_strategy
      - entity: sensor.solarbalance_grid_power
      - entity: sensor.solarbalance_pv_power
      - entity: sensor.solarbalance_battery_power
      - entity: sensor.solarbalance_baseline_consumption
      - entity: binary_sensor.solarbalance_storm_mode
      - entity: binary_sensor.solarbalance_weather_warning
      - entity: binary_sensor.solarbalance_degraded
      # Per-device setpoints:
      - entity: sensor.solarbalance_setpoint_charge_stream_ultra_2
      - entity: sensor.solarbalance_setpoint_discharge_stream_ultra_2
      - entity: sensor.solarbalance_setpoint_charge_stream_tiny
      - entity: sensor.solarbalance_setpoint_discharge_stream_tiny
      - entity: sensor.solarbalance_setpoint_charge_jackery_chaudiere
      - entity: sensor.solarbalance_setpoint_discharge_jackery_chaudiere

  # ----- Overrides -----------------------------------------------------------
  - type: vertical-stack
    title: Controls & overrides
    cards:
      - type: custom:mushroom-select-card
        entity: select.solarbalance_mode

      - type: horizontal-stack
        cards:
          - type: button
            name: Storm mode
            icon: mdi:weather-lightning
            tap_action:
              action: call-service
              service: solarbalance.activate_storm_mode
              data:
                target_soc_pct: 95
                duration_h: 24

          - type: button
            name: Force charge 100%
            icon: mdi:battery-charging-100
            tap_action:
              action: call-service
              service: solarbalance.force_charge
              data:
                target_soc_pct: 100

          - type: button
            name: Force discharge 20%
            icon: mdi:battery-20
            tap_action:
              action: call-service
              service: solarbalance.force_discharge
              data:
                target_soc_pct: 20

          - type: button
            name: Pause
            icon: mdi:pause-circle
            tap_action:
              action: call-service
              service: solarbalance.pause

          - type: button
            name: Resume
            icon: mdi:play-circle
            tap_action:
              action: call-service
              service: solarbalance.resume

      - type: entities
        title: Zero-injection settings
        entities:
          - entity: switch.solarbalance_zero_injection
          - entity: number.solarbalance_zi_setpoint
          - entity: number.solarbalance_zi_hysteresis
