# Complete Lovelace view for SolarBalance.
# Requires HACS cards: power-flow-card-plus, apexcharts-card, mushroom.

title: SolarBalance
icon: mdi:solar-power-variant
path: solarbalance

cards:
  # ----- Top row: status + flow ----------------------------------------------
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: "{{ states('sensor.solarbalance_mode') | title }}"
        secondary: "Priority: {{ states('sensor.solarbalance_dominant_priority') }}"
        icon: mdi:home-battery
        icon_color: |-
          {% set m = states('sensor.solarbalance_mode') %}
          {% if m == 'storm' %}red
          {% elif m == 'degraded' %}orange
          {% elif m == 'paused' %}grey
          {% else %}green{% endif %}

      - type: custom:mushroom-entity-card
        entity: binary_sensor.solarbalance_zero_injection_active
        icon: mdi:transmission-tower-export
        name: Zero injection

  - type: custom:power-flow-card-plus
    title: Energy flow
    grid:
      entity: sensor.solarbalance_grid_power
    solar:
      entity: sensor.solarbalance_pv_total
    battery:
      entity: sensor.solarbalance_battery_power_total
      state_of_charge: sensor.solarbalance_battery_soc_avg
    home:
      entity: sensor.solarbalance_baseline_consumption
      override_state: true

  # ----- Forecast vs realised ------------------------------------------------
  - type: custom:apexcharts-card
    header:
      show: true
      title: PV — forecast vs realised (24 h)
    graph_span: 24h
    span:
      start: hour
    series:
      - entity: sensor.solarbalance_pv_total
        name: Realised
        type: area
      - entity: sensor.solcast_pv_forecast_forecast_today
        name: Forecast
        type: line
        stroke_width: 2

  # ----- Decisions log -------------------------------------------------------
  - type: entities
    title: Latest arbitration
    entities:
      - entity: sensor.solarbalance_dominant_priority
      - entity: sensor.solarbalance_arbitration_log
      - entity: sensor.solarbalance_zero_injection_error
      - entity: sensor.solarbalance_current_import_price
      - entity: sensor.solarbalance_current_export_price

  # ----- Overrides -----------------------------------------------------------
  - type: vertical-stack
    title: Overrides
    cards:
      - type: custom:mushroom-select-card
        entity: select.solarbalance_mode

      - type: horizontal-stack
        cards:
          - type: button
            name: Storm mode
            tap_action:
              action: call-service
              service: solarbalance.activate_storm_mode
              data:
                target_soc_pct: 95
                duration_h: 24

          - type: button
            name: Force charge 100%
            tap_action:
              action: call-service
              service: solarbalance.force_charge
              data:
                target_soc_pct: 100

          - type: button
            name: Pause
            tap_action:
              action: call-service
              service: solarbalance.pause
