# Jackery HomePower 2000 Ultra — station unique avec Shelly 1PM au PDL.
#
# Topologie :
#   - HomePower 2000 Ultra : batterie 2 kWh LFP + SolarSaga 1000W + onduleur 2200 VA
#   - Shelly 1PM           : compteur monophasé au point de livraison
#
# Les entités sensor.* correspondent aux noms exposés par l'intégration HA
# Jackery (HACS) avec le nom de machine « jackery_hp2000_salon ».
#
# Note : la convention de signe batterie Jackery est discharge_positive
# (positif = décharge) — SolarBalance normalise automatiquement.

solarbalance:
  devices:
    - name: jackery_hp2000_salon
      roles:
        battery:
          capacity_kwh: 2.042
          chemistry: lifepo4
          soc_min_pct: 10
          soc_max_pct: 95
          max_charge_power_w: 2200
          max_discharge_power_w: 2000
          soc_entity: sensor.jackery_hp2000_salon_battery_soc
          power_entity: sensor.jackery_hp2000_salon_battery_power
          power_sign_convention: discharge_positive
          temperature_entity: sensor.jackery_hp2000_salon_battery_temperature
        mppt:
          peak_power_w: 1000
          power_entity: sensor.jackery_hp2000_salon_solar_input_power
          daily_energy_entity: sensor.jackery_hp2000_salon_solar_energy_today
        inverter:
          nominal_power_w: 2200
          eps_capable: false
          ac_output_power_entity: sensor.jackery_hp2000_salon_ac_output_power

  meters:
    - name: pdl
      kind: pdl
      phases: 1
      power_entity: sensor.shelly_1pm_power
      power_sign_convention: import_positive
      daily_import_energy_entity: sensor.shelly_1pm_energy
